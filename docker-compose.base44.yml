services:
  web:
    image: node:22-slim
    working_dir: /app
    restart: on-failure
    ports:
      - "3000:3010"
    environment:
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX:-preview.local}
      # Optional public config — defaults live in src/lib/config.ts
      - NEXT_PUBLIC_CS_WHATSAPP=6281234567890
      - NEXT_PUBLIC_MERCHANT_NAME=TOPUPIN DIGITAL
    volumes:
      - .:/app
      # Keep installed deps in a named volume so they survive container rebuilds
      # without polluting the host checkout.
      - web_node_modules:/app/node_modules
    command: ["sh", "-ec", "npm install --no-audit --no-fund && exec npm run dev -- -H 0.0.0.0"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3010/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

volumes:
  web_node_modules:
